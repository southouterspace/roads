<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Builder</title>
<style>
  body { margin: 0; padding: 12px 16px; font: 14px/1.4 system-ui, sans-serif; background: #f4f1ea; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #333; color: #fff; border-color: #333; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; }
  canvas { display: block; max-width: 100%; touch-action: none; border-radius: 4px; }
  p { color: #555; max-width: 640px; }
</style>
</head>
<body>
  <h1>Road Builder</h1>
  <div class="bar" id="tools">
    <button data-tool="road">Road</button>
    <button data-tool="house">House</button>
    <button data-tool="shop">Shop</button>
    <button data-tool="bulldoze">Bulldoze</button>
  </div>
  <div class="stats">
    <span>Money: $<b id="money">0</b></span>
    <span>Delivered: <b id="delivered">0</b></span>
    <span>Cars: <b id="active">0</b></span>
  </div>
  <canvas id="board"></canvas>
  <p>Place houses and shops, then connect them with roads. Cars drive from houses to reachable shops and earn $15 per delivery. Click or drag to build; bulldozing refunds half.</p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
